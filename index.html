<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>드림 혼잡구역 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Galmuri11';font-display:swap;src:url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2') format('woff2')}
:root{
  --bg:#1F2225; --panel:#272B2F; --panel-2:#30353A; --field:#1B1E21; --line:#3C4248; --text:#E6E8E5; --dim:#99A0A6;
  --accent:#FFB21E; --ok:#3FBF6A; --bad:#E0493E;
  --kr:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --px:'Galmuri11','Noto Sans KR',monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--kr);font-size:13px;line-height:1.5;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h1{margin:0 8px 0 0;font-family:var(--px);font-size:13px;font-weight:400}
.bar h1 b{color:var(--accent)}
.bar .sp{flex:1}
.bar .size{font-family:var(--px);font-size:11px;color:var(--dim)}
.srv{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);padding:0 6px}
.srv[hidden]{display:none}
.srv i{width:8px;height:8px;background:var(--dim);display:inline-block}
.srv.ok i{background:var(--ok)}.srv.busy i{background:var(--accent);animation:blink 1s steps(1) infinite}.srv.err i{background:var(--bad)}
.srv label{display:flex;align-items:center;gap:4px;cursor:pointer}
@keyframes blink{50%{opacity:0}}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#5A626A}
.btn.main{background:var(--accent);color:#1A1A1A;border-color:var(--accent);font-weight:700}
.btn.ghost{background:none}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.icon{width:26px;height:26px;padding:0;display:grid;place-items:center;flex:none}
.btn:disabled{opacity:.35;cursor:default}
.btn[hidden]{display:none}

.work{display:grid;grid-template-columns:minmax(380px,460px) 1fr;min-height:0}
.side{overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--line);padding:12px 12px 80px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.view{display:grid;grid-template-rows:auto 1fr;min-height:0;background:#17191B}
.view-bar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line)}
.view-bar .lab{font-family:var(--px);font-size:11px;color:var(--dim)}
.stage{display:grid;place-items:center;overflow:auto;padding:16px}
.stage iframe{border:0;background:#C4C7C3;width:100%;height:100%;min-height:640px}
.stage.mobile iframe{width:375px;height:740px;min-height:0;border:1px solid var(--line)}

.sec{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.sec > summary{list-style:none;cursor:pointer;padding:9px 12px;font-family:var(--px);font-size:12px;display:flex;align-items:center;gap:8px}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::before{content:"▶";font-size:9px;color:var(--dim);transition:transform .2s}
.sec[open] > summary::before{transform:rotate(90deg)}
.sec > summary .hint{margin-left:auto;font-family:var(--kr);font-size:11px;color:var(--dim)}
.sec .in{padding:2px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}

.f{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;min-width:0}
.f > span{font-size:11.5px;color:var(--dim)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row2 > *{min-width:0}
.inp{width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:5px 8px;min-width:0;display:block}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:none;overflow:hidden;min-height:32px;line-height:1.45}
textarea.inp.big{min-height:64px}
select.inp{padding:4px 6px}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:15px;height:15px}

.num{display:flex;align-items:stretch}
.num .inp{width:56px;text-align:center;border-radius:0}
.num .btn{border-radius:0;width:28px;padding:0}
.num .btn:first-child{border-radius:4px 0 0 4px}
.num .btn:last-child{border-radius:0 4px 4px 0}

.seg{display:inline-flex;flex-wrap:wrap;justify-self:start;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;font-size:12px;color:var(--dim)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1A1A1A;font-weight:700}

.list{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:start;background:var(--panel-2);border-radius:4px;padding:5px}
.item .fields{display:grid;gap:5px;grid-template-columns:var(--cols,minmax(0,1fr));min-width:0}
.item .fields > *{min-width:0}
.ops{display:flex;gap:2px}
.add{justify-self:start}

.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sgn{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:7px 6px;text-align:left;display:grid;gap:1px;min-width:0}
.sgn .t{font-size:10.5px;color:var(--dim);font-family:var(--px)}
.sgn .c{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgn .n{position:absolute;right:6px;top:5px;font-family:var(--px);font-size:10px;color:var(--dim)}
.sgn .pic{position:absolute;right:6px;bottom:6px;font-family:var(--px);font-size:10px;color:var(--accent)}
.sgn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sgn-ops{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sgn-ops .k{margin-left:auto;font-size:11px;color:var(--dim)}

.bk{background:var(--panel-2);border:1px solid var(--line);border-radius:6px}
.bk-h{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-bottom:1px solid var(--line)}
.bk-h b{font-size:12px}
.bk-h .ops{margin-left:auto}
.bk-b{padding:8px;display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.bk .item{background:var(--panel)}
.adders{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px;border:1px dashed var(--line);border-radius:6px}
.adders span{font-size:11.5px;color:var(--dim);margin-right:2px}

.img-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:7px;align-items:start;background:var(--panel);border-radius:4px;padding:5px}
.img-item img{width:56px;height:44px;object-fit:cover;border-radius:2px;background:#111}
.img-item .fields{display:grid;gap:4px;min-width:0}
.drop{border:1px dashed #59616A;border-radius:5px;padding:12px;text-align:center;color:var(--dim);font-size:12px;transition:background .15s,border-color .15s}
.drop.over{background:rgba(255,178,30,.08);border-color:var(--accent);color:var(--text)}
.url-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px}
.tip{font-size:11px;color:var(--dim);margin:0}

/* 저장 창 */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(620px,100%);padding:16px;display:grid;gap:10px}
.modal h2{margin:0;font-family:var(--px);font-size:13px;font-weight:400}
.modal p{margin:0;color:var(--dim);font-size:12.5px}
.modal textarea{width:100%;height:220px;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:8px;font-family:ui-monospace,monospace;font-size:11px;resize:vertical;color:var(--dim)}
.modal .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:#111;color:#fff;border:1px solid var(--line);padding:7px 14px;border-radius:5px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:880px){
  body{overflow:auto;display:block}
  .work{grid-template-columns:1fr}
  .side{border-right:0;overflow:visible;padding-bottom:12px}
  .stage iframe{min-height:720px}
}

.fav{display:flex;align-items:center;gap:12px}
.fav-big{width:44px;height:44px;flex:none;padding:6px;background:var(--field);border:1px solid var(--line);border-radius:6px;object-fit:contain}
.fav-col{display:grid;gap:4px;min-width:0;flex:1}
.tabmock{display:flex;align-items:center;gap:7px;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:5px 10px}
.tabmock img{width:16px;height:16px;flex:none;object-fit:contain}
.tabmock span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="bar">
  <h1><b>▣</b> 드림 혼잡구역 에디터</h1>
  <button class="btn" id="bUndo" title="Ctrl+Z">되돌리기</button>
  <button class="btn" id="bRedo" title="Ctrl+Shift+Z / Ctrl+Y">다시하기</button>
  <span class="sp"></span>
  <span class="srv" id="srv" hidden><i></i><span id="srvTxt">서버 확인 중</span>
    <label title="고칠 때마다 잠깐 쉬면 서버에 저장"><input type="checkbox" id="srvAuto" checked>자동</label></span>
  <button class="btn" id="bSrvSave" hidden title="Ctrl+S">서버 저장</button>
  <button class="btn ghost" id="bSrvLoad" hidden>서버에서 불러오기</button>
  <span class="size" id="size"></span>
  <button class="btn ghost" id="bBackup">JSON 백업</button>
  <button class="btn ghost" id="bImport">불러오기</button>
  <input type="file" id="fImport" accept=".json,.html,.htm" hidden>
  <button class="btn ghost" id="bReset">처음 상태로</button>
  <button class="btn main" id="bExport">index.html 내보내기</button>
</div>

<div class="work">
  <div class="side" id="side"></div>
  <div class="view">
    <div class="view-bar">
      <span class="lab">미리보기</span>
      <div class="seg" id="pvMode"><button data-v="closed">접힌 상태</button><button data-v="open">펼친 상태</button><button data-v="sign">선택한 표지판</button></div>
      <div class="seg" id="pvWidth"><button data-v="pc">PC</button><button data-v="mobile">모바일</button></div>
    </div>
    <div class="stage" id="stage"><iframe id="pv" title="미리보기"></iframe></div>
  </div>
</div>

<div class="modal" id="mExport" hidden role="dialog" aria-modal="true" aria-labelledby="mExportT">
  <div class="box">
    <h2 id="mExportT">index.html 내보내기</h2>
    <p>"파일로 받기"가 안 되는 환경(미리보기 창 안 등)이면 아래 코드를 전부 복사해서 index.html로 저장하면 돼요.</p>
    <textarea id="code" readonly spellcheck="false"></textarea>
    <div class="acts">
      <button class="btn ghost" id="bClose">닫기</button>
      <button class="btn" id="bCopy">코드 복사</button>
      <button class="btn main" id="bDl">파일로 받기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const TEMPLATE = "\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>드림 혼잡구역\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Barlow+Semi+Condensed:wght@600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n@font-face{font-family:'Galmuri11';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2') format('woff2')}\n@font-face{font-family:'Galmuri11';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2') format('woff2')}\n\n:root{\n  --page:#C4C7C3;\n  --g:#0F6A3A; --b:#1E58AD; --r:#D22A2A; --y:#F4B400; --k:#1A1A1A; --w:#fff;\n  --soft:#F1F2EF; --line:#D9DBD6; --dim:#646A6F; --led:#FFB21E;\n  --kr:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;\n  --en:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;\n  --px:'Galmuri11','Noto Sans KR',monospace;\n  --ease:cubic-bezier(.22,.61,.36,1);\n  color-scheme:light;box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n}\n/* ── 무드 테마 공통 ── */\n.dz-deco{position:absolute;inset:0;pointer-events:none}\n.dz-deco.back{z-index:-1}.dz-deco.front{z-index:6}\n.dz-win{display:none}\nhtml[data-dz=\"angel\"] :is(.dz-shadow,.dz-frame,.dz-card),html[data-dz=\"y2k\"] :is(.dz-shadow,.dz-frame,.dz-card),\nhtml[data-dz=\"stamp\"] :is(.dz-shadow,.dz-frame,.dz-card){clip-path:none}\nhtml:is([data-dz=\"angel\"],[data-dz=\"y2k\"],[data-dz=\"stamp\"]) .dz-card::after{display:none}\n\n/* ═══ 엔젤코어: 하늘색·은색 창, 레이스, 하프톤, 아스키 ═══ */\nhtml[data-dz=\"angel\"]{--g:#7397C8;--r:#8DB0DB;--b:#9DBBE3;--page:#E lcd\" id=\"dzLcd\">\n        \u003cdiv class=\"l1\">\u003cspan class=\"fq\">\u003csmall>FM\u003c/small>\u003cspan data-r=\"fq\">--.-\u003c/span>\u003c/span>\u003cspan class=\"st\" data-r=\"station\">\u003c/span>\n          \u003cspan class=\"vol\">VOL\u003cinput data-r=\"vnum\" type=\"number\" min=\"0\" max=\"100\" inputmode=\"numeric\" aria-label=\"볼륨 숫자\">\u003c/span>\u003cspan data-r=\"clk\" hidden>\u003c/span>\u003c/div>\n        \u003cdiv class=\"l2\" data-r=\"l2\">\u003cspan data-r=\"title\">전원을 켜 주세요\u003c/span>\u003c/div>\n        \u003cdiv class=\"tv\">\u003cdiv id=\"dzYt\">\u003c/div>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"r2\">\n      \u003cdiv class=\"dz-presets\" data-r=\"presets\">\u003c/div>\n      \u003cbutton class=\"dz-rb\" type=\"button\" data-r=\"prev\" aria-label=\"이전 곡\">◀◀\u003c/button>\n      \u003cbutton class=\"dz-rb\" type=\"button\" data-r=\"play\" aria-label=\"재생\">▶\u003c/button>\n      \u003cbutton class=\"dz-rb\" type=\"button\" data-r=\"next\" aria-label=\"다음 곡\">▶▶\u003c/button>\n    \u003c/div>\n  \u003c/div>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"dz-lb\" id=\"dzLb\" role=\"dialog\" aria-modal=\"true\" aria-label=\"이미지 크게 보기\" aria-hidden=\"true\">\n  \u003cdiv class=\"box\">\n    \u003cdiv class=\"frame\">\u003c/div>\n    \u003cdiv class=\"info\">\u003c/div>\n    \u003cdiv class=\"bar\">\u003cbutton type=\"button\" data-lb=\"prev\">◀ 이전\u003c/button>\u003cspan data-lb=\"count\">\u003c/span>\u003cbutton type=\"button\" data-lb=\"next\">다음 ▶\u003c/button>\u003cbutton type=\"button\" data-lb=\"close\">닫기\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(() => {\nconst RAW = JSON.parse(document.getElementById('dz-data').textContent);\nconst TAG = { '오픈':'#1E58AD', '배려':'#C98A00', '극온리':'#D22A2A', '온리':'#A83A62', 'CBC':'#2F8A57', 'NCP':'#5E6469' };\nconst esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n\n/* 예전 형식 데이터 → 블록 형식 */\nfunction normalize(d){\n  d.signs = (d.signs || []).map(s => {\n    if (Array.isArray(s.blocks)) return s;\n    const b = [];\n    if (s.imagePos === 'top' && s.images?.length) b.push({ type:'images', mode:s.imageMode || 'grid', foldLabel:s.foldLabel, items:s.images });\n    if (s.rows?.length) b.push({ type:'rows', rows:s.rows });\n    if (s.text) b.push({ type:'text', text:s.text });\n    if (s.list?.length) b.push({ type:'list', items:s.list, dot:s.dot });\n    if (s.dreams?.length) b.push({ type:'dreams', items:s.dreams });\n    if (s.note) b.push({ type:'note', text:s.note });\n    if (s.links?.length) b.push({ type:'links', items:s.links });\n    if (s.imagePos !== 'top' && s.images?.length) b.push({ type:'images', mode:s.imageMode || 'grid', foldLabel:s.foldLabel, items:s.images });\n    const { sign, caption, title, value, top, bottom } = s;\n    return { sign, caption, title, value, top, bottom, blocks:b };\n  });\n  return d;\n}\nconst DATA = normalize(RAW);\nif (DATA.theme === 'collage') DATA.theme = 'day';\nif (DATA.theme && DATA.theme !== 'day') document.documentElement.dataset.dz = DATA.theme;\nwindow.DZ_BG = ['y2k','angel','stamp'].includes(DATA.theme) ? DATA.theme : 'traffic';\n{ const f = { angel:'Pinyon+Script', y2k:'Silkscreen:wght@400;700', stamp:'Anton' }[DATA.theme];\n  if (f){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `https://fonts.googleapis.com/css2?family=${f}&display=swap`; document.head.append(l); } }\nconst PV = window.DZ_PREVIEW;\n\n/* ─────────── 효과음 (파일 없이 직접 합성) ─────────── */\nconst SND = (() => {\n  let ac = null, on = DATA.sound !== false;\n  try { const v = localStorage.getItem('dz-sound'); if (v !== null && !PV) on = v === '1'; } catch {}\n  const ctx = () => { if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); } if (ac.state === 'suspended') ac.resume(); return ac; };\n  function tone(f, dur, { type='square', vol=.04, to=null, at=0 } = {}){\n    if (!on) return; const a = ctx(); if (!a) return;\n    const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();\n    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);\n    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);\n    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);\n  }\n  return {\n    get on(){ return on; },\n    set on(v){ on = v; try { localStorage.setItem('dz-sound', v ? '1' : '0'); } catch {} },\n    tick(){ tone(1900, .025, { type:'triangle', vol:.018 }); },\n    open(){ tone(660, .07, { to:990 }); tone(1320, .06, { at:.07, vol:.03 }); },\n    back(){ tone(880, .09, { to:440 }); },\n    unfold(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, .07, { at:i * .055, vol:.03 })); },\n    fold(){ [1046, 784, 523].forEach((f, i) => tone(f, .06, { at:i * .05, vol:.025 })); },\n    blip(){ tone(1200, .04, { type:'triangle', vol:.03 }); },\n    tvOn(){ tone(180, .18, { type:'sawtooth', to:1400, vol:.02 }); },\n    tvOff(){ tone(1400, .2, { type:'sawtooth', to:120, vol:.02 }); },\n    sparkle(){ [2093, 2637, 3136, 4186].forEach((f, i) => tone(f, .09, { type:'triangle', at:i * .04, vol:.025 })); },\n    chime(){ [1318, 1760, 2093].forEach((f, i) => tone(f, .7, { type:'sine', at:i * .08, vol:.035 })); },\n    ding(){ tone(1568, .12, { type:'sine', vol:.05 }); tone(2093, .25, { type:'sine', at:.1, vol:.04 }); },\n    stamp(){ tone(110, .14, { type:'sine', to:45, vol:.18 }); tone(220, .04, { type:'square', vol:.03 }); },\n    honk(p = 1){ [0, .17].forEach(at => { tone(330 * p, .12, { at, vol:.05 }); tone(415 * p, .12, { at, vol:.04 }); }); },\n  };\n})();\n\n/* ─────────── 표지판 그림 ─────────── */\nconst KR = \"font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif\";\nconst EN = \"font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif\";\nlet K = '#1A1A1A', Y = '#F4B400', R = '# y-13*k}Q${cx-16.5*k} ${y-16.5*k} ${cx-13*k} ${y-16.5*k}H${cx+13*k}Q${cx+16.5*k} ${y-16.5*k} ${cx+16.5*k} ${y-13*k}V${y-4*k}Z\" fill=\"${K}\"/>\n  \u003crect x=\"${cx-15*k}\" y=\"${y-13.4*k}\" width=\"${6.2*k}\" height=\"${3.6*k}\" rx=\"${1.1*k}\" fill=\"${R}\"/>\n  \u003crect x=\"${cx+8.8*k}\" y=\"${y-13.4*k}\" width=\"${6.2*k}\" height=\"${3.6*k}\" rx=\"${1.1*k}\" fill=\"${R}\"/>\n  \u003crect x=\"${cx-14*k}\" y=\"${y-12.8*k}\" width=\"${2*k}\" height=\"${1.2*k}\" fill=\"#FF8A80\"/>\n  \u003crect x=\"${cx+12*k}\" y=\"${y-12.8*k}\" width=\"${2*k}\" height=\"${1.2*k}\" fill=\"#FF8A80\"/>\n  \u003crect x=\"${cx-4.6*k}\" y=\"${y-12.6*k}\" width=\"${9.2*k}\" height=\"${4*k}\" rx=\"${.6*k}\" fill=\"${Y}\"/>\n  \u003crect x=\"${cx-15.5*k}\" y=\"${y-7.4*k}\" width=\"${31*k}\" height=\"${.9*k}\" fill=\"${Y}\" opacity=\".55\"/>\n  \u003crect x=\"${cx-15.4*k}\" y=\"${y-4.6*k}\" width=\"${7*k}\" height=\"${5.4*k}\" rx=\"${1.6*k}\" fill=\"${K}\"/>\n  \u003crect x=\"${cx+8.4*k}\" y=\"${y-4.6*k}\" width=\"${7*k}\" height=\"${5.4*k}\" rx=\"${1.6*k}\" fill=\"${K}\"/>\u003c/g>`;\n\n/* 경고(삼각) 표지 */\nconst TRI_O = `\u003cpolygon points=\"120,6 234,206 6,206\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"8\" stroke-linejoin=\"round\"/>`;\nconst TRI_R = `\u003cpolygon points=\"120,14 226,200 14,200\" fill=\"${R}\" stroke=\"${R}\" stroke-width=\"4\" stroke-linejoin=\"round\"/>`;\nconst tri = inner => `\u003csvg viewBox=\"0 0 240 214\" width=\"78\">\n  \u003cpolygon points=\"120,6 234,206 6,206\" fill=\"none\" stroke=\"#000\" stroke-opacity=\".22\" stroke-width=\"11\" stroke-linejoin=\"round\"/>\n  ${TRI_O}${TRI_R}\n  \u003cpolygon points=\"120,50 196,184 44,184\" fill=\"${Y}\" stroke=\"${Y}\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n  \u003cpolygon points=\"120,46 199,186 41,186\" fill=\"none\" stroke=\"${K}\" stroke-width=\"1.5\" stroke-linejoin=\"round\" opacity=\".22\"/>\n  ${inner}${finish(TRI_R)}${rivet(120,34)}${rivet(120,193)}\u003c/svg>`;\nconst CIR = r => `\u003ccircle cx /* 파일 받기: claude.ai에서는 downloads 기능, 그 밖에서는 일반 다운로드 */
const CAP = name => (window.claude?.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null));
const capDl = CAP('downloads');
async function saveFile(filename, data, mime){
  const dl = await capDl;
  if (dl){
    try { await dl.save({ filename, data }); return true; }
    catch (e){ if (e?.code === 'rejected' || e?.code === 'dismissed') return false; }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: mime }));

    setTimeout(() => URL.revokeObjectURL(a.href), 3000);

  } catch { return false; }
}
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };

/* ───────── 서버 저장 (claude.ai에서 열었을 때) ───────── */
const SRV = (() => {
  const el = $('#srv'), txt = $('#srvTxt');
  let db = null, uid = null, busy = false, again = false, t = null;
  const CHUNK = 200000;
  const state = (cls, msg) => { el.className = 'srv ' + cls; txt.textContent = msg; };
  const col = () => db.collection('data/users/' + uid);
  async function init(){
    if (!window.claude?.use) return;
    el.hidden = false; state('busy', '서버 연결 중');
    const [d, u] = await Promise.all([CAP('db'), CAP('user')]);
    uid = u ? await u.id().catch(() => null) : null;
    if (!d || !uid){ state('err', '서버 저장 안 됨 (로그인 필요)'); return; }
    db = d; $('#bSrvSave').hidden = false; $('#bSrvLoad').hidden = false;
    try {
      const meta = await col().doc('dz-meta').get();
      if (meta.exists){
        const m = meta.data();
        state('ok', `서버 ${fmt(m.savedAt)}`);
        if (!loadLocal() || m.savedAt > (+localStorage.getItem(STORE + '-at') || 0)) await load(true);
      } else { state('ok', '서버 연결됨'); }
    } catch { state('err', '서버 읽기 실패'); }
  }
  const fmt = ts => { const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  async function save(manual){
    if (!db) { if (manual) toast('서버에 연결되어 있지 않아요'); return; }
    if (busy){ again = true; return; }
    busy = true; state('busy', '저장 중');
    try {
      const json = JSON.stringify(S), parts = [];
      for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
      const old = await col().doc('dz-meta').get();
      const oldParts = old.exists ? (old.data().parts || 0) : 0;
      for (let i = 0; i < parts.length; i++) await col().doc('dz-part-' + i).set({ s: parts[i] });
      const at = Date.now();
      await col().doc('dz-meta').set({ parts: parts.length, savedAt: at, size: json.length });
      for (let i = parts.length; i < oldParts; i++) await col().doc('dz-part-' + i).delete();
      try { localStorage.setItem(STORE + '-at', String(at)); } catch {}
      state('ok', `서버 ${fmt(at)}`); if (manual) toast('서버에 저장했어요');
    } catch (e){ state('err', '서버 저장 실패'); if (manual) toast('서버 저장에 실패했어요. JSON 백업을 받아 두세요'); }
    busy = false;
    if (again){ again = false; save(); }
  }
  async function load(silent){
    if (!db) return;
    state('busy', '불러오는 중');
    try {
      const meta = await col().doc('dz-meta').get();
      if (!meta.exists){ state('ok', '서버 연결됨'); if (!silent) toast('서버에 저장된 내용이 없어요'); return; }
      const m = meta.data(); let json = '';
      for (let i = 0; i < m.parts; i++){ const p = await col().doc('dz-part-' + i).get(); json += p.data()?.s || ''; }
      const d = JSON.parse(json);
      mutate(() => { S = normalize(d); sel = 0; });
      state('ok', `서버 ${fmt(m.savedAt)}`); toast('서버 내용을 불러왔어요');
    } catch { state('err', '불러오기 실패'); }
  }
  function queue(){ if (!db || !$('#srvAuto').checked) return; clearTimeout(t); t = setTimeout(() => save(false), 4000); }
  return { init, save, load, queue, get on(){ return !!db; } };
})();

const grow = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; };
/* 글 입력칸: 기본은 줄바꿈 되는 칸, line:true면 한 줄 칸 */
function text(label, obj, key, opt = {}){

  else { inp = h('textarea', { class:'inp' + (opt.big ? ' big' : ''), rows:1, placeholder: opt.ph || '' }); requestAnimationFrame(() => grow(inp)); }
  inp.value = obj[key] ?? '';

  if (opt.onEnter) inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); opt.onEnter(); } });

function number(label, obj, key, min, max, stepBy){
  const inp = h('input', { class:'inp', type:'number', min, max, inputmode:'numeric' });
  inp.value = obj[key] ?? 0;
  const set = v => { v = Math.max(min, Math.min(max, Math.round(+v || 0))); obj[key] = v; inp.value = v; };
  inp.addEventListener('input', () => { if (inp.value === '') return; set(inp.value); typed(); });
  inp.addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); set((+inp.value || 0) + (e.key === 'ArrowUp' ? 1 : -1)); typed(); } });
  const st = stepBy || (max > 10 ? 5 : 1);
  const step = d => () => { snap(); set((+obj[key] || 0) + d * st); snap(); persist(); refresh(); };
  return h('label', { class:'f' }, h('span', {}, label),
    h('div', { class:'num' }, h('button', { class:'btn', type:'button', onclick:step(-1), 'aria-label':'줄이기' }, '−'), inp,

function opsFor(arr, i, extra){

async function fileToData(file){
  if (file.type === 'image/gif') return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let url = c.toDataURL('image/webp', .85);
  if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', .85);
  return url;
}

  for (const f of list){ try { add.push({ src: await fileToData(f), title: f.name.replace(/\.[^.]+$/, ''), desc:'' }); } catch {} }
  mutate(() => { b.items = (b.items || []).concat(add); });

    case 'links': return [listEditor(b, 'items', [{ k:'label', ph:'이름', w:'6em' }, { k:'sub', ph:'보조 글', w:'6.5em' }, { k:'url', ph:'https://', line:true }], '링크 추가', { label:'', sub:'', url:'' }, uid)];

/* ───────── 탭 제목 · 파비콘 입력 ───────── */
async function fileToFavicon(file){
  const raw = () => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
  if (file.type === 'image/svg+xml' || /\.(svg|ico)$/i.test(file.name)){ if (file.size > 150000) throw new Error('big'); return raw(); }
  const bmp = await createImageBitmap(file), n = 128, k = Math.min(n / bmp.width, n / bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = n;
  const w = bmp.width * k, hh = bmp.height * k;
  c.getContext('2d').drawImage(bmp, (n - w) / 2, (n - hh) / 2, w, hh);
  bmp.close?.();
  return c.toDataURL('image/png');
}
let paintMeta = () => {};

  const themeName = Object.fromEntries(THEMES)[S.theme || 'day'];
  const big = h('img', { class:'fav-big', alt:'파비콘 미리보기' });

  const tabT = h('span', {});
  const stat = h('p', { class:'tip' });
  const urlIn = h('input', { class:'inp' });
  const fileIn = h('input', { type:'file', accept:'image/*,.ico', hidden:true });
  const rst = h('button', { class:'btn sm ghost', type:'button', onclick: () => mutate(() => S.favicon = '') }, '테마 기본으로');
  const up = h('button', { class:'btn sm', type:'button', onclick: () => fileIn.click() }, '이미지 올리기');

  const paint = () => {
    const v = String(S.favicon || '').trim(), href = faviconHref(S);
    big.src = href; small.src = href; tabT.textContent = tabTitle(S);
    stat.textContent = !v ? `따로 고르지 않아서 ${themeName} 테마의 대표 표지판이 들어가요`
      : v.startsWith('data:') ? '올린 이미지를 쓰고 있어요' : '입력한 아이콘을 쓰고 있어요';
    rst.disabled = !v;
    urlIn.placeholder = v.startsWith('data:') ? '올린 이미지 사용 중 (새 주소나 이모지를 쓰면 바뀌어요)' : '이미지 주소 또는 이모지 (예: 🚧)';
  };
  paintMeta = paint;

  const v0 = String(S.favicon || '');
  urlIn.value = v0.startsWith('data:') ? '' : v0;
  urlIn.addEventListener('input', () => { S.favicon = urlIn.value; typed(); });
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0]; fileIn.value = ''; if (!f) return;
    try { const url = await fileToFavicon(f); mutate(() => S.favicon = url); toast('파비콘을 바꿨어요'); }
    catch { toast('이 이미지는 파비콘으로 못 읽었어요 (SVG·ICO는 150KB까지)'); }
  });

  const d = section('meta', '탭 제목 · 파비콘', null,
    text('탭 제목 (브라우저 탭에 보이는 이름)', S, 'pageTitle', { line:true, ph: tabTitle({ title:S.title }) }),
    h('p', { class:'tip' }, '비워 두면 큰 제목을 그대로 써요.'),
    h('div', { class:'fav' }, big, h('div', { class:'fav-col' }, h('div', { class:'tabmock' }, small, tabT), stat)),
    h('label', { class:'f' }, h('span', {}, '파비콘 (이미지 주소 / 이모지)'), urlIn),
    h('div', { class:'btns' }, up, rst, fileIn));
  paint();
  return d;
}

    text('방송국 이름', S.bgm, 'label', { line:true, ph:'FM 드림 혼잡' }),

    h('p', { class:'tip' }, '채널이 하나라도 있으면 카드 아래에 접힌 카 라디오가 생겨요. 여러 곡이면 끝날 때 다음 채널로 넘어가요. 소리는 보는 사람이 재생을 눌러야 나요. 이 에디터 미리보기에서는 유튜브가 막혀서 재생이 안 될 수 있지만, 내보낸 index.html에서는 재생돼요.')));

  side.append(section('ticker', '하단 전광판 문구', `${(S.ticker || []).length}줄`,
    h('p', { class:'tip' }, '엔터를 누르면 다음 문구 칸이 생겨요.'),
    listEditor(S, 'ticker', null, '문구 추가', { line:true }, 'ticker')));

  const grid = h('div', { class:'signs' }, S.signs.map((s, i) =>
    h('button', { class:'sgn', type:'button', 'aria-pressed': String(i === sel), onclick: () => { sel = i; render(); refresh(); } },
      h('span', { class:'t' }, TYPE_NAME[s.sign] || s.sign),

  const full = S.signs.length >= MAX_SIGNS;
  side.append(section('signs', '표지판 배치', `${S.signs.length} / ${MAX_SIGNS}`, grid,
    h('div', { class:'sgn-ops' },
      h('button', { class:'btn sm', type:'button', disabled: full, onclick: () => mutate(() => { S.signs.splice(sel + 1, 0, { sign:'jam', caption:'새 표지판', title:'새 표지판', blocks:[clone(NEW_BLOCK.text)] }); sel++; }) }, '+ 추가'),
      h('button', { class:'btn sm', type:'button', disabled: full, onclick: () => mutate(() => { S.signs.splice(sel + 1, 0, clone(S.signs[sel])); sel++; }) }, '복제'),
      h('button', { class:'btn sm', type:'button', disabled: sel === 0, onclick: () => mutate(() => { [S.signs[sel - 1], S.signs[sel]] = [S.signs[sel], S.signs[sel - 1]]; sel--; }) }, '← 앞으로'),
      h('button', { class:'btn sm', type:'button', disabled: sel === S.signs.length - 1, onclick: () => mutate(() => { [S.signs[sel + 1], S.signs[sel]] = [S.signs[sel], S.signs[sel + 1]]; sel++; }) }, '뒤로 →'),
      h('button', { class:'btn sm', type:'button', disabled: S.signs.length <= 1, onclick: () => mutate(() => { S.signs.splice(sel, 1); sel = Math.min(sel, S.signs.length - 1); }) }, '삭제'),
      h('span', { class:'k' }, '선택 후 Ctrl+C · X · V'))));

  const s = S.signs[sel];

    BLOCKS.map(([t, l]) => h('button', { class:'btn sm', type:'button', onclick: () => mutate(() => s.blocks.push(clone(NEW_BLOCK[t]))) }, `+ ${l}`)));

  side.append(section('edit', `선택한 표지판 · ${sel + 1}번`, TYPE_NAME[s.sign],
    h('div', { class:'row2' },
      select('표지판 종류', s.sign, SIGN_TYPES, v => mutate(() => {
        s.sign = v;
        if (v === 'speed' && !s.value) s.value = '30';
        if (v === 'section' && !s.top){ s.top = '구간내'; s.bottom = '2019~'; }

    h('p', { class:'tip' }, '아래 블록들은 순서대로 보여요. 글, 이미지, 목록을 원하는 만큼 섞어 쓰고 ↑↓로 순서를 바꾸세요.'),

  side.scrollTop = keep;
  document.querySelectorAll('#pvMode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === pvMode)));

/* ───────── 토스트 ───────── */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

/* ───────── 내보내기 창 ───────── */
const modal = $('#mExport');
function openExport(){ snap(); $('#code').value = build(S); modal.hidden = false; $('#bDl').focus(); }
function closeExport(){ modal.hidden = true; }
$('#bExport').onclick = openExport;
$('#bClose').onclick = closeExport;
modal.addEventListener('click', e => { if (e.target === modal) closeExport(); });
$('#bDl').onclick = async () => { const ok = await saveFile('index.html', build(S), 'text/html'); toast(ok ? 'index.html을 받았어요' : '파일 받기가 막혀 있어요. 코드 복사를 써 주세요'); };
$('#bCopy').onclick = async () => {
  const ta = $('#code');
  try { await navigator.clipboard.writeText(ta.value); toast('전체 코드를 복사했어요'); }
  catch { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('전체 코드를 복사했어요'); } catch { toast('코드 칸을 전체 선택해서 직접 복사해 주세요'); } }
};

/* ───────── 단축키 ───────── */
const isField = el => el && (el.matches?.('input, textarea, select') || el.isContentEditable);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modal.hidden) return closeExport();
  const mod = e.ctrlKey || e.metaKey; if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y'){ e.preventDefault(); redo(); }
  else if (k === 's'){ e.preventDefault(); SRV.on ? SRV.save(true) : openExport(); }
});
const noSel = () => !isField(document.activeElement) && !String(window.getSelection()).length && modal.hidden;
document.addEventListener('copy', e => {
  if (!noSel()) return;
  e.preventDefault(); e.clipboardData.setData('text/plain', JSON.stringify({ dzSign: S.signs[sel] }));
  toast(`${sel + 1}번 표지판 복사`);
});
document.addEventListener('cut', e => {
  if (!noSel()) return;
  e.preventDefault();
  if (S.signs.length <= 1) return toast('마지막 표지판은 잘라낼 수 없어요');
  e.clipboardData.setData('text/plain', JSON.stringify({ dzSign: S.signs[sel] }));
  mutate(() => { S.signs.splice(sel, 1); sel = Math.min(sel, S.signs.length - 1); });
  toast('표지판 잘라냄');
});
/* 붙여넣기: 입력칸에서는 서식 없이 글자만, 밖에서는 표지판 붙여넣기 */
const clean = (t, oneLine) => {
  t = t.replace(/\r\n?/g, '\n').replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\u00A0/g, ' ').replace(/\t/g, ' ').replace(/[ ]+\n/g, '\n');
  return oneLine ? t.replace(/\n+/g, ' ').trim() : t.replace(/\n{3,}/g, '\n\n');
};
document.addEventListener('paste', e => {
  const el = document.activeElement;
  if (isField(el) && el.matches('input:not([type=number]):not([type=checkbox]), textarea')){
    if (el.readOnly) return;
    e.preventDefault();
    const t = clean(e.clipboardData.getData('text/plain'), el.tagName === 'INPUT');
    el.setRangeText(t, el.selectionStart, el.selectionEnd, 'end');
    el.dispatchEvent(new Event('input', { bubbles:true }));
    return;
  }
  if (isField(el)) return;
  let item; try { item = JSON.parse(e.clipboardData.getData('text/plain')).dzSign; } catch {}
  if (!item) return;
  e.preventDefault();
  if (S.signs.length >= MAX_SIGNS) return toast(`표지판은 ${MAX_SIGNS}개까지예요`);
  mutate(() => { S.signs.splice(sel + 1, 0, normalize({ signs:[item] }).signs[0]); sel++; });
  toast('표지판 붙여넣음');
});

/* ───────── 버튼 ───────── */
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#bSrvSave').onclick = () => SRV.save(true);
$('#bSrvLoad').onclick = () => { if (confirm('서버에 저장된 내용으로 바꿀까요? 되돌리기(Ctrl+Z)로 돌아올 수 있어요.')) SRV.load(false); };
$('#bBackup').onclick = async () => { snap(); const ok = await saveFile(`dream-zone-backup-${stamp()}.json`, JSON.stringify(S, null, 2), 'application/json'); toast(ok ? 'JSON 백업을 받았어요' : '파일 받기가 막혀 있어요'); };
$('#bReset').onclick = () => { if (confirm('예시 내용으로 되돌릴까요? 되돌리기(Ctrl+Z)로 돌아올 수 있어요.')) mutate(() => { S = normalize(clone(DEFAULT)); sel = 0; }); };
$('#bImport').onclick = () => $('#fImport').click();
$('#fImport').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const txt = await f.text(); e.target.value = '';
  let d = null;
  try {
    if (/\.json$/i.test(f.name)) d = JSON.parse(txt);
    else { const m = txt.match(/<script type="application\/json" id="dz-data">([\s\S]*?)<\/script>/); if (m) d = JSON.parse(m[1]); }
  } catch {}
  if (!d || !Array.isArray(d.signs)) return toast('이 에디터로 만든 파일이 아니에요');
  mutate(() => { S = normalize(d); sel = 0; });
  toast('불러왔어요');
});
document.querySelectorAll('#pvMode button').forEach(b => b.onclick = () => { pvMode = b.dataset.v; render(); refresh(); });
document.querySelectorAll('#pvWidth button').forEach(b => b.onclick = () => { pvWidth = b.dataset.v; $('#stage').classList.toggle('mobile', pvWidth === 'mobile'); render(); });
addEventListener('resize', () => document.querySelectorAll('textarea.inp').forEach(grow));
$('#side').addEventListener('input', () => paintMeta());

render(); refresh(); SRV.init();
})();
